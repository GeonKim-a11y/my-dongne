# 지하철역 위치를 OpenStreetMap 에서 받아 갱신한다 (수동 실행 전용, 키 불필요).
name: update-stations
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_stations.py
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add web/data/stations.json
          if git diff --staged --quiet; then echo "변경 없음"; else git commit -m "data: 지하철역 갱신 $(date -u +%F)"; git pull --rebase -q; git push; fi
