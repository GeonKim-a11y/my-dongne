# 매월 한 번, 최근 12개월 실거래가(매매·전세·월세)를 새로 받아 데이터 파일을 갱신하고 저장소에 커밋한다.
# 저장소에 커밋이 생기면 Vercel이 자동으로 다시 배포한다. (Vercel에 Git 연결 필요)
name: update-market-data

on:
  schedule:
    - cron: "0 21 5 * *"      # 매월 5일 UTC 21:00 = 한국 시간 6일 06:00
  workflow_dispatch:          # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 실거래가 수집 (최근 12개월, 최근 3개월은 매번 다시 받음)
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python scripts/fetch_prices.py --months 12 --refresh-months 3

      - name: 의료기관 위치 수집 (병원정보서비스 활용신청이 안 됐으면 이 단계만 실패하고 넘어감)
        continue-on-error: true
        env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python scripts/fetch_hospitals.py

      - name: 변경이 있으면 커밋
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add web/data/market_by_dong.json data/cache
          git add web/data/hospitals.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 실거래가 갱신 $(date -u +%F)"
            git push
          fi
