# 의료기관 위치만 따로 갱신한다 (수동 실행 전용, 약 5분).
name: update-hospitals
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          PUBLIC_DATA_API_KEY: ${{ secrets.PUBLIC_DATA_API_KEY }}
        run: python scripts/fetch_hospitals.py
      - run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add web/data/hospitals.json
          if git diff --staged --quiet; then echo "변경 없음"; else git commit -m "data: 의료기관 갱신 $(date -u +%F)"; git pull --rebase -q; git push; fi
